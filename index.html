<head>

<meta name="mobile-web-app-capable" content="yes">

<title>MeToo</title>
<style>
/* ===== DESIGN: change colours and sizes here ===== */
:root{
  --brand:#f4b7fa; --sos:#c62828; --bg:#fff8f6; --card:#f9fbf9; --ink:#1d1b1b;
  --warn:#ffecb3; --info:#eceff1; --radius:14px; --line:#e6dcd9;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;height:100%}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);display:flex;flex-direction:column;overscroll-behavior:none;font-size:16px;line-height:1.4}
main{flex:1;overflow-y:auto;padding:calc(16px + env(safe-area-inset-top)) 16px 16px}
h2{margin:0 0 8px;font-size:22px} h3{margin:0 0 8px}
p{margin:0 0 12px}
.center{text-align:center} .strong{font-weight:600} .hint{white-space:pre-line;color:#444}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px;margin-bottom:12px}
.card.warn{background:var(--warn);border-color:#f0d58a} .card.info{background:var(--info)}
.row{display:flex;gap:12px;align-items:center} .between{justify-content:space-between}
.row>.btn{flex:1}
.btn{display:inline-block;text-align:center;text-decoration:none;font:inherit;font-weight:600;border:2px solid var(--brand);background:var(--brand);color:#fff;border-radius:var(--radius);padding:12px 16px;cursor:pointer}
.btn.outline{background:transparent;color:var(--brand)}
.btn.small{padding:6px 12px;flex:none}
.btn.big{font-size:22px;padding:22px 28px}
label{display:block;font-weight:600;margin:10px 0 4px}
input,textarea,select{width:100%;font:inherit;padding:10px;border:1px solid #bbb;border-radius:10px;background:#fff;-webkit-user-select:text;user-select:text}
textarea{min-height:110px}
.choice{display:block;width:100%;text-align:left;font:inherit;color:inherit;cursor:pointer}
.choice b{display:block;font-size:17px;color:var(--brand);margin-bottom:2px}
ul{padding-left:20px;margin:0 0 12px} li{margin-bottom:6px}
.sos-wrap{display:flex;justify-content:center;margin:28px 0 20px}
.sos-btn{width:220px;height:220px;border-radius:50%;border:0;background:var(--sos);color:#fff;font-size:56px;font-weight:800;box-shadow:0 8px 24px rgba(183,28,28,.45);touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.sos-btn:active{transform:scale(.97)}
nav{display:flex;border-top:1px solid var(--line);background:#fff;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;padding:10px 4px;font:inherit;font-size:13px;color:#555}
nav button .ic{display:block;font-size:22px}
nav button.on{color:var(--brand);font-weight:700}
details{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:10px;padding:2px 12px}
summary{padding:12px 0;font-weight:600;cursor:pointer}
details ul{margin:0 0 12px;padding-left:20px} details li{margin-bottom:8px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:20px;z-index:60}
.box{background:#fff;border-radius:18px;padding:18px;width:100%;max-width:420px;max-height:90vh;overflow:auto}
.box .btn{display:block;width:100%;margin-top:10px}
.msg{background:var(--info);border-radius:10px;padding:10px;white-space:pre-wrap;word-break:break-word;font-size:14px}
#sirenLayer{position:fixed;inset:0;z-index:40;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center;animation:flash .7s infinite alternate}
@keyframes flash{from{background:#b71c1c}to{background:#ff5252}}
.siren-title{font-size:44px;font-weight:800}
.dots{font-size:30px;letter-spacing:8px;margin:6px 0 12px;min-height:40px}
.keys{display:grid;grid-template-columns:repeat(3,76px);gap:12px;justify-content:center}
.key{height:62px;border-radius:50%;border:0;background:rgba(255,255,255,.92);color:#222;font-size:26px;font-weight:600}
.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
#toast{position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:20px;z-index:70;max-width:90%;font-size:14px}

#panicLayer{position:fixed;inset:0;z-index:50;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center;animation:flash .7s infinite alternate;cursor:pointer;-webkit-user-select:none;user-select:none}
#panicLayer .big{font-size:30px;font-weight:800}
#panicLayer a{color:#fff;text-decoration:underline;margin-top:36px;padding:12px}

main{padding-top:calc(46px + env(safe-area-inset-top))}
#lockLayer{position:fixed;inset:0;z-index:90;background:var(--brand);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:24px;text-align:center}
#qexit{position:fixed;top:calc(8px + env(safe-area-inset-top));right:8px;z-index:100;border:0;border-radius:18px;background:#333;color:#fff;opacity:.9;font:inherit;font-size:13px;font-weight:600;padding:7px 14px;cursor:pointer}
</style>
</head>

/* ===== helpers ===== */
const $ = (s, r = document) => r.querySelector(s);
function h(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === 'class') e.className = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (v === true) e.setAttribute(k, '');
    else if (v !== false && v != null) e.setAttribute(k, v);
  }
  for (const k of kids.flat(Infinity)) {
    if (k == null || k === false) continue;
    e.append(k.nodeType ? k : document.createTextNode(String(k)));
  }
  return e;
}
function fill(parent, ...kids) { parent.replaceChildren(...kids.flat(Infinity).filter(k => k != null && k !== false)); }
const store = {
  get(k, d) { try { const v = localStorage.getItem('MeToo_' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('MeToo_' + k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem('MeToo_' + k); } catch (e) {} }
};
let toastTimer;
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, 3000);
}
const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const isStandalone = !!(navigator.standalone || (window.matchMedia && matchMedia('(display-mode: standalone)').matches));

function normalizePhone(raw) {
  const c = String(raw).replace(/[^0-9+]/g, '');
  if (c.startsWith('+')) return c;
  if (c.length === 10) return '+91' + c;
  if (c.length === 11 && c.startsWith('0')) return '+91' + c.slice(1);
  if (c.length === 12 && c.startsWith('91')) return '+' + c;
  return c;
}
const validPhone = n => /^\+?[0-9]{10,14}$/.test(n);
const pad = n => String(n).padStart(2, '0');
function stamp(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes()); }

async function hashPin(pin) {
  try {
    const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('MeToo:' + pin));
    return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2, '0')).join('');
  } catch (e) { return 'plain:' + pin; }
}
async function checkPin(pin) { return (await hashPin(pin)) === store.get('pin', null); }

function copyText(t) {
  try { navigator.clipboard.writeText(t).then(() => toast('Copied'), () => toast('Could not copy')); }
  catch (e) { toast('Could not copy'); }
}
async function shareText(t) {
  if (navigator.share) { try { await navigator.share({ text: t }); return; } catch (e) {} }
  copyText(t);
}

function modal(build) {
  const layer = h('div', { class: 'modal' });
  const close = () => layer.remove();
  layer.append(h('div', { class: 'box' }, build(close)));
  $('#overlay').append(layer);
  return close;
}

/* ===== location + SMS ===== */
function getPosition() {
  return new Promise(res => {
    if (!navigator.geolocation) return res(null);
    navigator.geolocation.getCurrentPosition(p => res(p.coords), () => res(null),
      { enableHighAccuracy: true, timeout: 8000, maximumAge: 30000 });
  });
}
async function buildMessage() {
  const c = await getPosition();
  const d = new Date(), t = pad(d.getHours()) + ':' + pad(d.getMinutes());
  if (!c) return 'EMERGENCY: I need help. I could not get my location. Please call me now. (MeToo, ' + t + ')';
  return 'EMERGENCY: I need help. My location: https://maps.google.com/?q=' + c.latitude.toFixed(6) + ',' + c.longitude.toFixed(6) +
    ' (accuracy about ' + Math.round(c.accuracy) + ' m). Sent via MeToo at ' + t + '.';
}
function smsUri(contacts, body) {
  const nums = contacts.map(c => c.phone).join(',');
  const b = encodeURIComponent(body);
  return isIOS ? 'sms:/open?addresses=' + encodeURIComponent(nums) + '&body=' + b : 'sms:' + nums + '?body=' + b;
}
function smsSheet(contacts, msg) {
  const uri = smsUri(contacts, msg);
  modal(close => [
    h('h3', {}, 'Message ready'),
    h('p', { class: 'msg' }, msg),
    h('a', { class: 'btn', href: uri, onclick: () => setTimeout(close, 400) }, 'Open Messages, then tap Send'),
    h('button', { class: 'btn outline', onclick: () => copyText(msg) }, 'Copy message'),
    h('button', { class: 'btn outline', onclick: close }, 'Close')
  ]);
  try { location.href = uri; } catch (e) {}   // opens Messages by itself if the browser allows it
}
function countdownDialog(sec) {
  return new Promise(res => {
    let left = sec, t, done = false;
    const title = h('h3', {}, 'Alerting contacts in ' + left + ' s');
    const finish = v => { if (done) return; done = true; clearInterval(t); close(); res(v); };
    const close = modal(() => [
      title,
      h('p', {}, 'Your location will be sent to your trusted contacts. Tap Cancel if this was a mistake.'),
      h('button', { class: 'btn outline', onclick: () => finish(false) }, 'Cancel'),
      h('button', { class: 'btn', onclick: () => finish(true) }, 'Send now')
    ]);
    t = setInterval(() => { left--; title.textContent = 'Alerting contacts in ' + left + ' s'; if (left <= 0) finish(true); }, 1000);
  });
}
async function startAlert(countdown) {
  const cs = store.get('contacts', []);
  if (!cs.length) { toast('Add a trusted contact first'); show('contacts'); return; }
  if (countdown && !(await countdownDialog(5))) return;
  smsSheet(cs, await buildMessage());
}

let sirenOn = false, wake = null;
const audioEl = () => $('#siren');
async function startSiren() {
  if (sirenOn) return;
  sirenOn = true;
  let blocked = false;
  try { const a = audioEl(); a.currentTime = 0; a.volume = 1; await a.play(); } catch (e) { blocked = true; }
  renderSirenLayer(blocked);
  try { if (navigator.wakeLock) wake = await navigator.wakeLock.request('screen'); } catch (e) {}
}
function stopSiren() {
  try { audioEl().pause(); } catch (e) {}
  sirenOn = false;
  $('#sirenLayer').hidden = true;
  try { if (wake) wake.release(); } catch (e) {}
  wake = null;
}
function keypad(onOk, label) {
  let val = '';
  const dots = h('div', { class: 'dots' });
  const upd = () => { dots.textContent = '●'.repeat(val.length) + '○'.repeat(4 - val.length); };
  const box = h('div', {});
  const press = async d => {
    if (val.length >= 4) return;
    val += d; upd();
    if (val.length === 4) {
      if (await checkPin(val)) onOk();
      else { val = ''; upd(); box.classList.add('shake'); setTimeout(() => box.classList.remove('shake'), 350); }
    }
  };
  upd();
  const keys = [1, 2, 3, 4, 5, 6, 7, 8, 9, '', 0, '⌫'].map(k => k === '' ? h('span', {}) :
    h('button', { class: 'key', onclick: () => { if (k === '⌫') { val = val.slice(0, -1); upd(); } else press(String(k)); } }, String(k)));
  box.append(h('p', {}, label || 'Enter your PIN to stop'), dots, h('div', { class: 'keys' }, keys));
  return box;
}
function renderSirenLayer(blocked) {
  const L = $('#sirenLayer'); L.hidden = false; L.replaceChildren(h('div', { class: 'siren-title' }, 'SIREN ON'));
  if (blocked) {
    L.append(h('p', {}, 'Your browser needs one tap to start the sound.'),
      h('button', { class: 'btn big', style: 'background:#fff;color:#b71c1c;border-color:#fff', onclick: async () => {
        try { await audioEl().play(); } catch (e) {}
        renderSirenLayer(false);
      } }, 'TAP TO START SIREN'));
    return;
  }
  L.append(h('p', {}, 'Turn your phone volume up.'));
  if (store.get('pin', null)) L.append(keypad(stopSiren));
  else L.append(h('button', { class: 'btn big', style: 'background:#fff;color:#b71c1c;border-color:#fff', onclick: stopSiren }, 'STOP'),
                h('p', {}, 'Tip: set a PIN in the Contacts tab so only you can stop it.'));
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && sirenOn) {
    const a = audioEl(); if (a.paused) a.play().catch(() => {});
    if (!wake && navigator.wakeLock) navigator.wakeLock.request('screen').then(w => { wake = w; }).catch(() => {});
  }
});

    choice('File a police complaint', 'Get a ready-to-use complaint letter and know what to expect.', () => goHelp('police')),

    choice('Talk to someone / get counselling', 'Free helplines, and your campus women\'s cell.', () => goHelp('support')),
    choice('Share with my campus women\'s cell', 'You choose what is sent, and when.', () => goHelp('cell')),
    choice('Do nothing for now', 'Your record stays saved. You can return whenever you are ready.', () => goHelp('home'))
  ];
}

function helpPolice(c) {
  const letter = h('textarea', { style: 'min-height:280px' }); letter.value = policeLetter(c);
  return [
    backBtn('choose'), h('h2', {}, 'File a police complaint'),
    h('div', { class: 'card warn' }, 'This app does not send anything to the police. It prepares your letter. You take it to a police station, or use the options below.'),
    h('h3', {}, 'Your options'), bullets(DATA.police.options),
    h('h3', {}, 'Your complaint letter (edit if you like)'), letter,
    h('div', { class: 'row', style: 'margin:8px 0 16px' },
      h('button', { class: 'btn small', onclick: () => shareText(letter.value) }, 'Share'),
      h('button', { class: 'btn small outline', onclick: () => copyText(letter.value) }, 'Copy')),
    h('h3', {}, 'What to bring'), bullets(DATA.police.bring),
    h('h3', {}, 'If the police refuse'), bullets(DATA.police.refuse),
    h('div', { class: 'row' }, h('a', { class: 'btn outline', href: 'tel:112' }, 'Call 112'), h('a', { class: 'btn outline', href: 'tel:181' }, 'Call 181'))
  ];
}

function helpRights(c) {
  const inc = INCIDENTS.find(x => x.id === c.type) || INCIDENTS[4];
  return [
    backBtn('choose'), h('h2', {}, 'Your rights'), h('p', {}, 'For: ' + inc.label),
    h('div', { class: 'card warn' }, DATA.disclaimer),
    inc.topics.map((i, n) => {
      const t = DATA.topics[i];
      const d = h('details', {}, h('summary', {}, t.title), h('p', {}, t.summary), bullets(t.points));
      if (n === 0) d.open = true;
      return d;
    }),
    h('p', { class: 'center' }, h('button', { class: 'btn small outline', onclick: () => show('rights') }, 'See all rights and helplines'))
  ];
}

function cellBlock() {
  const cell = DATA.cell;
  if (!(cell.phone || cell.email || cell.formUrl)) {
    return h('div', { class: 'card info' }, h('b', {}, 'Campus women\'s cell'), h('div', {}, 'Your cell has not added its contact details to this app yet.'));
  }
  return h('div', { class: 'card' }, h('b', {}, cell.name || 'Campus women\'s cell'),
    cell.phone ? h('div', {}, h('a', { href: 'tel:' + cell.phone }, 'Call ' + cell.phone)) : null,
    cell.email ? h('div', {}, h('a', { href: 'mailto:' + cell.email }, cell.email)) : null,
    cell.formUrl ? h('div', {}, h('a', { href: cell.formUrl, target: '_blank', rel: 'noopener' }, 'Open the cell\'s form')) : null);
}

function helpSupport(c) {
  const note = h('textarea', { placeholder: 'Write whatever you feel. Only you can see this.' });
  return [
    backBtn(c ? 'choose' : 'home'), h('h2', {}, 'Talk to someone'),
    h('p', {}, 'You do not have to report anything to talk to someone. These helplines are free.'),
    DATA.support.map(x => h('a', { class: 'card row', href: 'tel:' + x.number, style: 'text-decoration:none;color:inherit' },
      h('b', { style: 'min-width:64px;color:var(--brand)' }, x.number), h('div', {}, h('b', {}, x.name), h('div', {}, x.note)))),
    cellBlock(),
    h('h3', {}, 'Write it down, just for you'),
    h('p', {}, 'A private space to put your experience into words. It is saved only on this phone.'),
    note,
    h('button', { class: 'btn', style: 'margin-top:10px;width:100%', onclick: () => {
      const txt = note.value.trim();
      if (!txt) return toast('Write something first');
      if (c) updateRecord(c.id, r => { r.details = (r.details ? r.details + '\n\n' : '') + txt; });
      else { const r = addRecord({ type: 'other', details: txt }); helpId = r.id; }
      toast('Saved on this phone'); note.value = '';
    } }, 'Save note'),
    h('div', { class: 'card warn', style: 'margin-top:16px' }, 'In danger or thinking of harming yourself? Call 112 now.')
  ];
}

function helpCell(c) {
  const cell = DATA.cell;
  const t = h('textarea', { style: 'min-height:240px' }); t.value = recordText(c);
  return [
    backBtn('choose'), h('h2', {}, 'Share with the women\'s cell'),
    h('p', {}, 'Read and edit the text. Delete anything you do not want to share, including your name and number. Nothing is sent until you tap a button.'),
    t,
    h('div', { style: 'margin-top:10px' },
      cell.formUrl ? h('button', { class: 'btn', onclick: () => { copyText(t.value); window.open(cell.formUrl, '_blank', 'noopener'); } }, 'Copy text and open the cell\'s form') : null,
      cell.email ? h('button', { class: 'btn outline', onclick: () => { location.href = 'mailto:' + cell.email + '?subject=' + encodeURIComponent('Message to the women\'s cell') + '&body=' + encodeURIComponent(t.value); } }, 'Email the cell') : null,
      h('button', { class: 'btn outline', onclick: () => shareText(t.value) }, 'Share using another app')),
    (cell.formUrl || cell.email) ? null : h('p', { style: 'margin-top:12px' }, 'The cell has not added its contact details yet. You can still use "Share" to send this to someone you trust.')
  ];
}

function renderRights() {
  return h('section', {},
    h('h2', {}, 'Your rights'),
    h('div', { class: 'card warn' }, DATA.disclaimer),
    h('h3', {}, 'Helplines (tap to call)'),
    DATA.helplines.map(x => h('a', { class: 'card row', href: 'tel:' + x.number, style: 'text-decoration:none;color:inherit' },
      h('b', { style: 'min-width:64px;color:var(--brand)' }, x.number), h('div', {}, h('b', {}, x.name), h('div', {}, x.note)))),
    h('h3', { style: 'margin-top:20px' }, 'Know your rights'),
    DATA.topics.map(t => h('details', {}, h('summary', {}, t.title), h('p', {}, t.summary), h('ul', {}, t.points.map(p => h('li', {}, p))))));
}

const TABS = [
  { id: 'help', label: 'Get help', icon: '\u{1F91D}', render: renderHelp },
  { id: 'sos', label: 'SOS', icon: '\u{1F198}', render: renderSos },
  { id: 'contacts', label: 'Contacts', icon: '\u{1F465}', render: renderContacts },
  { id: 'rights', label: 'Rights', icon: '⚖️', render: renderRights }
];
function show(id) {
  const t = TABS.find(x => x.id === id) || TABS[0];
  $('#view').replaceChildren(t.render()); $('#view').scrollTop = 0;
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.id === t.id));
}
$('#tabs').append(...TABS.map(t => h('button', { 'data-id': t.id, onclick: () => show(t.id) }, h('span', { class: 'ic' }, t.icon), t.label)));
show('help');

/* Links used by iPhone Back Tap / Android shortcuts:  #alert  and  #siren */
function fromHash() {
  const hsh = location.hash;
  if (hsh === '#alert') startAlert(true);
  if (hsh === '#siren') { sirenOn = true; renderSirenLayer(true); startAlert(false); }
}
window.addEventListener('hashchange', fromHash);
fromHash();

/* ===== Emergency icon: panic.html opens index.html?panic=1 ===== */
function showPanicTap() {
  /* Opening the icon = tap 1. Touch anywhere: 2 taps = alert, 3 taps = siren. */
  let n = 1, timer = null;
  const hint = h('p', { class: 'big' }, 'Tap again: 1 more = alert, 2 more = siren');
  const L = h('div', { id: 'panicLayer' },
    h('div', { class: 'siren-title' }, 'EMERGENCY'), hint,
    h('a', { href: './', onclick: e => e.stopPropagation() }, 'Opened by mistake? Open the app'));
  const end = () => { clearTimeout(timer); L.remove(); };
  L.addEventListener('pointerdown', e => {
    if (e.target.closest && e.target.closest('a')) return;
    try { if (navigator.vibrate) navigator.vibrate(30); } catch (x) {}
    clearTimeout(timer); n++;
    if (n >= 3) { end(); startEmergency(); return; }
    hint.textContent = 'Tap ' + n + '... one more = siren';
    timer = setTimeout(() => { end(); startAlert(true); }, 700);
  });
  timer = setTimeout(end, 2500);   // no more taps: opened by mistake, nothing happens
  document.body.append(L);
}
function panicStart() { showPanicTap(); }
if (/[?&]panic=1/.test(location.search)) panicStart();


/* ===== Privacy: quick exit + app lock ===== */
function quickExit() {
  if (sirenOn) return toast('Stop the siren first');
  try { location.replace('https://www.google.com/search?q=weather+today'); } catch (e) { location.href = 'https://www.google.com/'; }
}
document.body.append(h('button', { id: 'qexit', 'aria-label': 'Quick exit', onclick: quickExit }, 'Quick exit \u2715'));
const lockLayer = h('div', { id: 'lockLayer', hidden: true });
document.body.append(lockLayer);
function lockApp() {
  if (!store.get('applock', false) || !store.get('pin', null)) return;
  lockLayer.hidden = false;
  lockLayer.replaceChildren(h('div', { class: 'siren-title', style: 'font-size:34px' }, 'MeToo'),
    keypad(() => { lockLayer.hidden = true; }, 'Enter your PIN to open'));
}
const emergencyOpen = /[?&]panic=1/.test(location.search) || location.hash === '#alert' || location.hash === '#siren';
if (!emergencyOpen) lockApp();
let hiddenAt = 0;
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') hiddenAt = Date.now();
  else if (hiddenAt && Date.now() - hiddenAt > 60000 && !sirenOn) lockApp();
});

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
